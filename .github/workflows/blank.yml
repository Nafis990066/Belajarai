name: Build BelajarAI GPT

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Ekstrak source ZIP
        run: |
          unzip -o BelajarAI-HuggingFace.zip -d extracted
          ls extracted/BelajarAI

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Instal Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted/BelajarAI
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: BelajarAI-GPT-APK
          path: extracted/BelajarAI/app/build/outputs/apk/debug/app-debug.apk
